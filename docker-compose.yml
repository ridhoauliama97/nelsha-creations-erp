# AureusERP — stack Docker Alpine ringan (semua image berbasis Alpine).
#
# Service:
#   app    : php:8.4-fpm-alpine + nginx-alpine (satu image, build dari docker/php/Dockerfile)
#   mysql  : mariadb:11-alpine (kompatibel MySQL, Laravel DB_CONNECTION=mysql tetap dipakai)
#   queue  : image yang sama dengan app, perintah queue:work
#
# Cara pakai:
#   docker compose up --build -d      # build + jalankan
#   docker compose logs -f            # lihat log
#   docker compose down               # berhenti
#   docker compose down -v            # berhenti + hapus volume data
#
# Akses: http://localhost:8080  (panel admin: http://localhost:8080/admin)
# Admin awal: admin@example.com / password — GANTI setelah login pertama.
#   Ubah lewat variabel ADMIN_* di bawah, atau .env:
#
# Catatan .env: kode aplikasi dibakar (COPY) ke dalam image. Perubahan file
# kode/.env di host baru terlihat setelah `docker compose up --build`.
# Override cepat tanpa rebuild: ubah `environment:` di bawah (langsung dipakai).
#
# Queue worker pakai --memory=512 (flag Laravel, bukan php.ini): boot aplikasi
# dengan semua plugin ter-install sudah melewati 128 MB, default --memory
# bawaan Laravel membuat worker berhenti segera setelah start.

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: aureuserp-app
    restart: unless-stopped
    ports:
      - '${APP_PORT:-8080}:80'
      - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
    environment:
      APP_NAME: '${APP_NAME:-AureusERP}'
      APP_ENV: '${APP_ENV:-local}'
      APP_DEBUG: '${APP_DEBUG:-true}'
      APP_URL: '${APP_URL:-http://localhost:8080}'
      APP_LOCALE: 'id'
      APP_FALLBACK_LOCALE: 'en'
      APP_FAKER_LOCALE: 'id_ID'
      APP_CURRENCY: 'IDR'
      APP_TIMEZONE: 'Asia/Jakarta'
      APP_COUNTRY: 'ID'
      DB_CONNECTION: 'mysql'
      DB_HOST: 'mysql'
      DB_PORT: '3306'
      DB_DATABASE: '${DB_DATABASE:-aureuserp}'
      DB_USERNAME: '${DB_USERNAME:-aureuserp}'
      DB_PASSWORD: '${DB_PASSWORD:-secret}'
      # Kredensial admin untuk instalasi otomatis pertama.
      ADMIN_NAME: '${ADMIN_NAME:-Administrator}'
      ADMIN_EMAIL: '${ADMIN_EMAIL:-admin@example.com}'
      ADMIN_PASSWORD: '${ADMIN_PASSWORD:-password}'
      AUTO_INSTALL: 'true'
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy

  queue:
    image: aureuserp-app
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: '${APP_ENV:-local}'
      APP_LOCALE: 'id'
      APP_CURRENCY: 'IDR'
      APP_TIMEZONE: 'Asia/Jakarta'
      DB_CONNECTION: 'mysql'
      DB_HOST: 'mysql'
      DB_PORT: '3306'
      DB_DATABASE: '${DB_DATABASE:-aureuserp}'
      DB_USERNAME: '${DB_USERNAME:-aureuserp}'
      DB_PASSWORD: '${DB_PASSWORD:-secret}'
      RUN_QUEUE: '1'
      AUTO_INSTALL: 'false'
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_healthy
    # Override healthcheck image (wget /health): di container queue nginx tidak
    # jalan — healthcheck image selalu gagal walau worker sehat. Cek prosesnya.
    healthcheck:
      test: ['CMD-SHELL', 'pgrep -f "queue:work"']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # MariaDB 11 (kompatibel wire-protocol MySQL, driver Laravel `mysql` tetap dipakai).
  # Imej resmi mysql:8.0 berukuran 1,1 GB & bukan Alpine; MariaDB hanya 458 MB.
  # Ingin MySQL asli (Oracle)? Ganti image menjadi 'mysql:8.0' dan env menjadi
  # MYSQL_ROOT_PASSWORD / MYSQL_DATABASE / MYSQL_USER / MYSQL_PASSWORD.
  mysql:
    image: 'mariadb:11'
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - '${FORWARD_DB_PORT:-3306}:3306'
    environment:
      MARIADB_ROOT_PASSWORD: '${DB_ROOT_PASSWORD:-rootsecret}'
      MARIADB_DATABASE: '${DB_DATABASE:-aureuserp}'
      MARIADB_USER: '${DB_USERNAME:-aureuserp}'
      MARIADB_PASSWORD: '${DB_PASSWORD:-secret}'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  mysql-data:
    driver: local
  app-storage:
    driver: local
